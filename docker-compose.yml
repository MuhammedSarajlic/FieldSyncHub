services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: fieldsync
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WebApiDatabase: "server=mysql;database=fieldsync;user=root;password=${DB_PASSWORD:-root};"
      AppSettings__Token: ${JWT_TOKEN:-6niNItCw45h6QmxkFUvy9tTVRea17jDk5IDT6LbgIy9oTf5pA0Jj5ipgePKm6bLhnBMNxw4tJpyhvkfE}
      AppSettings__FrontendUrl: ${VITE_BASE_URL_ORIGIN:-http://localhost:5173}
      AppSettings__GoogleClientId: ${GOOGLE_CLIENT_ID:-}
      AppSettings__SendGrid__ApiKey: ${SENDGRID_API_KEY:-}
      AppSettings__SendGrid__SenderEmail: ${SENDGRID_SENDER_EMAIL:-invmansis@gmail.com}
      AppSettings__SendGrid__SenderName: FieldSyncHub
    ports:
      - "5244:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:5244/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
