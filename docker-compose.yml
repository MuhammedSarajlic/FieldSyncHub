services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: fieldsync
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__WebApiDatabase: "server=mysql;database=fieldsync;user=root;password=${DB_PASSWORD:-root};"
      # Required - no default. Set JWT_TOKEN in .env (see .env.example); the
      # backend fails to start if it's missing or too short.
      AppSettings__Token: ${JWT_TOKEN:?JWT_TOKEN must be set in .env - see .env.example}
      AppSettings__FrontendUrl: ${VITE_BASE_URL_ORIGIN:-http://localhost:5173}
      AppSettings__GoogleClientId: ${GOOGLE_CLIENT_ID:-}
      AppSettings__Resend__ApiToken: ${RESEND_API_TOKEN:-}
      AppSettings__Resend__SenderEmail: ${RESEND_SENDER_EMAIL:-onboarding@resend.dev}
      AppSettings__Resend__SenderName: FieldSyncHub
      AppSettings__Supabase__Url: ${SUPABASE_URL:-}
      AppSettings__Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY:-}
      AppSettings__Supabase__Bucket: ${SUPABASE_STORAGE_BUCKET:-uploads}
      # This compose file always sets ASPNETCORE_ENVIRONMENT to Development (it's a
      # local/dev convenience setup - hot-reloading frontend volume mount and all),
      # which would otherwise default the refresh cookie to Secure=false regardless
      # of where it's actually run. Set COOKIE_SECURE=true in .env if you deploy
      # this compose file somewhere real.
      AppSettings__CookieSecure: ${COOKIE_SECURE:-}
    ports:
      - "5244:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mysql_data:
