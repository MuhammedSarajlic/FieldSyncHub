name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore FieldSyncHub.sln
      - name: Build with warnings as errors
        run: dotnet build backend/backend.csproj --no-restore --warnaserror
      - name: Test
        env:
          RUN_MYSQL_TESTS: true
        run: dotnet test backend.Tests/backend.Tests.csproj --no-restore --logger trx

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript build
        run: npx tsc -b
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend
