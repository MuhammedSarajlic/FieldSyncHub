name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore FieldSyncHub.sln
      - name: Build with warnings as errors
        run: dotnet build backend/backend.csproj --no-restore --warnaserror
      - name: Generate OpenAPI schema and client
        env:
          ASPNETCORE_ENVIRONMENT: Development
          AppSettings__Token: ci-only-token-that-is-long-enough-for-hmac-sha512-0123456789
        run: |
          nohup dotnet run --project backend/backend.csproj --no-build --no-launch-profile --urls http://127.0.0.1:5244 > /tmp/fieldsynchub-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5244/swagger/v1/swagger.json > /tmp/fieldsynchub-openapi.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/fieldsynchub-openapi.json
          npm ci --prefix frontend
          npm run api:generate --prefix frontend -- /tmp/fieldsynchub-openapi.json
          git diff --exit-code -- frontend/src/api/generated.ts
      - name: Test
        env:
          RUN_MYSQL_TESTS: true
        run: dotnet test backend.Tests/backend.Tests.csproj --no-restore --logger trx

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: TypeScript build
        run: npx tsc -b
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Accessibility smoke test
        run: npm run test:e2e -- --grep "accessibility smoke checks"

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend
